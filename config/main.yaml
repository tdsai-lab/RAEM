paths:
  pretrained_root: ./.cache
  output_root: ./outputs
  log_root: ./logs
  run_root: ./runs
  ckpt_root: ./checkpoints
model:
  policy_model_name: hZzy/qwen2-0.5b-sft
  reference_model_name: hZzy/qwen2-0.5b-sft (frozen)
  policy_model_path: hZzy/qwen2-0.5b-sft
  reference_model_path: hZzy/qwen2-0.5b-sft
  tokenizer_path: hZzy/qwen2-0.5b-sft
  model_family: qwen2
  trust_remote_code: false
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16
  use_chat_template: true
  max_prompt_length: 512
  max_response_length: 1024
  prompt_template: "User: {prompt}\n\nAssistant:"
  system_prompt: ""
privacy:
  dp_mechanism: linear_topb_em
  noise_mode: linear_topb_em
  epsilon: 1.0
  boundary_rank: null
  rank_branch_mode: hard_noisy_rank
  dp_score_function: linear
  noise_seed: 42
  loss_type: rpw_kto
  beta: 0.1
  kto_lambda_d: 1.0
  kto_lambda_u: 1.0
data:
  dataset_mode: list_ultrafeedback
  list_ultrafeedback_name: NDCG-alignment/ListUltraFeedback
  list_ultrafeedback_train_split: train
  list_ultrafeedback_eval_split: test
  prepared_root: ./data/prepared
  split_seed: 42
  num_candidates: 8
  min_candidates: 8
  list_ultrafeedback_score_min: -0.07257080078125
  list_ultrafeedback_score_max: 0.94775390625
  max_train_samples: 0
  max_eval_samples: 0
  num_proc: 1
  overwrite_prepared: false
training:
  seed: 42
  output_name: qwen2_0p5b_instruct_private_score_alignment
  optim: adamw_torch
  num_train_epochs: 1.0
  learning_rate: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  bf16: true
  fp16: false
  tf32: true
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  do_eval: true
  do_final_eval: true
  save_total_limit: 2
  dataloader_num_workers: 2
  report_to:
    - tensorboard
  deepspeed_config: ./config/deepspeed/zero2.json
  run_name: qwen2-0p5b-instruct-private-score-alignment
  remove_unused_columns: false
  ddp_find_unused_parameters: false
